<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Full bleed background (no rounded corners - maskable safe zone) -->
  <rect width="512" height="512" fill="url(#bg)" />
  <!-- Outer target ring (safe zone ~40% from edge) -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="white" stroke-width="16" stroke-opacity="0.9" />
  <!-- Middle target ring -->
  <circle cx="256" cy="256" r="78" fill="none" stroke="white" stroke-width="13" stroke-opacity="0.7" />
  <!-- Center dot -->
  <circle cx="256" cy="256" r="26" fill="white" />
  <!-- Top crosshair -->
  <line x1="256" y1="100" x2="256" y2="150" stroke="white" stroke-width="16" stroke-linecap="round" stroke-opacity="0.9" />
  <!-- Bottom crosshair -->
  <line x1="256" y1="362" x2="256" y2="412" stroke="white" stroke-width="16" stroke-linecap="round" stroke-opacity="0.9" />
  <!-- Left crosshair -->
  <line x1="100" y1="256" x2="150" y2="256" stroke="white" stroke-width="16" stroke-linecap="round" stroke-opacity="0.9" />
  <!-- Right crosshair -->
  <line x1="362" y1="256" x2="412" y2="256" stroke="white" stroke-width="16" stroke-linecap="round" stroke-opacity="0.9" />
</svg>
