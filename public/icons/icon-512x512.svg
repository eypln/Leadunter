<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />
  <!-- Outer target ring -->
  <circle cx="256" cy="256" r="156" fill="none" stroke="white" stroke-width="18" stroke-opacity="0.9" />
  <!-- Middle target ring -->
  <circle cx="256" cy="256" r="96" fill="none" stroke="white" stroke-width="15" stroke-opacity="0.7" />
  <!-- Center dot -->
  <circle cx="256" cy="256" r="30" fill="white" />
  <!-- Top crosshair -->
  <line x1="256" y1="60" x2="256" y2="128" stroke="white" stroke-width="18" stroke-linecap="round" stroke-opacity="0.9" />
  <!-- Bottom crosshair -->
  <line x1="256" y1="384" x2="256" y2="452" stroke="white" stroke-width="18" stroke-linecap="round" stroke-opacity="0.9" />
  <!-- Left crosshair -->
  <line x1="60" y1="256" x2="128" y2="256" stroke="white" stroke-width="18" stroke-linecap="round" stroke-opacity="0.9" />
  <!-- Right crosshair -->
  <line x1="384" y1="256" x2="452" y2="256" stroke="white" stroke-width="18" stroke-linecap="round" stroke-opacity="0.9" />
</svg>
